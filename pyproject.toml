[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peft-memory-probe"
version = "0.1.0"
description = "Controlled-memory PEFT experiment for transferable hallucination detection"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "datasets>=3.2,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "peft>=0.14,<1",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "transformers>=4.47,<5",
]

[project.scripts]
peft-probe = "peft_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
